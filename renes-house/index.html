<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f2ec"><link rel="manifest" href="./manifest.webmanifest"><title>René's House</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#24251f;background:#f5f2ec}*{box-sizing:border-box}body{margin:0}main{max-width:650px;margin:auto;padding:22px 16px 70px}h1{font-size:2rem;margin:0}p{color:#65685e}label{display:block;font-weight:650;margin:20px 0 9px}.picker{display:block;border:2px dashed #a7ab9f;border-radius:18px;padding:30px;text-align:center;background:white;cursor:pointer}input[type=file]{position:absolute;opacity:0;width:1px;height:1px}textarea,input[type=url]{width:100%;border:1px solid #c9cbbf;border-radius:13px;padding:15px;font:inherit;background:white}textarea{min-height:100px}button{font:inherit;cursor:pointer;border:0;border-radius:13px;padding:15px;background:#244e3b;color:white;font-weight:700}button:disabled{opacity:.5}button.secondary{background:#e5e8df;color:#244e3b}.actions{display:flex;gap:10px;margin-top:14px}.actions button{flex:1}img{max-width:100%;border-radius:12px}.preview{display:none;margin-top:14px}.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.item{background:white;border-radius:15px;padding:8px;overflow:hidden}.item img{width:100%;aspect-ratio:1;object-fit:cover}.item p{font-size:.85rem;margin:7px 3px;overflow-wrap:anywhere}.item button{padding:9px;width:100%}.status{min-height:22px}details{margin:25px 0;color:#555}small{color:#74786e}
</style></head><body><main><h1>🏡 René's House</h1><p>See what your renovations could look like.</p>
<label for="photo">1. Take or choose a photo</label><label class="picker" for="photo">📷 <strong>Tap to take or upload a photo</strong></label><input id="photo" type="file" accept="image/*"><img class="preview" id="preview" alt="Selected house photo">
<label for="instructions">2. What would you like to change?</label><textarea id="instructions" placeholder="Make the siding charcoal grey and add a wooden porch."></textarea>
<div class="actions"><button id="generate">✨ Show me</button><button class="secondary" id="clear">New photo</button></div><p id="status" class="status" role="status"></p>
<h2>My Gallery</h2><p><small>Saved on this device. Tap a picture to make another change.</small></p><div id="gallery" class="gallery"></div>
<details><summary>Setup (once)</summary><p>Enter your private image-editing backend URL. Never paste an API key here.</p><input id="endpoint" type="url" placeholder="https://your-server.example/api/edit"><button class="secondary" id="save" style="margin-top:10px">Save server URL</button></details>
</main><script src="./app.js"></script></body></html>
